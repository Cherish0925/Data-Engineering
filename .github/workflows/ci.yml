name: Data contracts and interfaces
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[mcp,test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist

  experience-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: Cherish0925/Verifiable-Agent-Gym
          ref: 821492e21d66b3adc2944a0fdb3239c495cd3ed8
          path: gym
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./data -e ./gym
      - run: python data/examples/experience_cycle.py --gym-tasks gym/examples/sql-workload/tasks.jsonl --output experience-cycle
      - uses: actions/upload-artifact@v4
        with:
          name: experience-cycle-result
          path: experience-cycle/result.json
